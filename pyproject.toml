[project]
name = "anki-star"
version = "0.1.0"
description = "A no-API-key coursework-to-Anki desktop add-on"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
